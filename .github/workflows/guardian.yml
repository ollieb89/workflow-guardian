name: Workflow Guardian
on:
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ollieb89/workflow-guardian@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
